<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Mova-se Mais</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5FAF6;--card:#fff;--tx:#12261B;--mu:#4A5F53;--pr:#17794B;--pr2:#0E8A8A;--ac:#F28C28;--acx:#3A2204;--ln:#D3E4D9;--soft:#E4F3EA;--on:#fff;--sh:0 4px 18px rgba(18,38,27,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A14;--card:#17261D;--tx:#EEF6F0;--mu:#B5C8BB;--pr:#4FD18A;--pr2:#4CCFCF;--ln:#2B4033;--soft:#1D3327;--acx:#2A1800;--on:#0B1A12}}
:root[data-theme="dark"]{--bg:#0F1A14;--card:#17261D;--tx:#EEF6F0;--mu:#B5C8BB;--pr:#4FD18A;--pr2:#4CCFCF;--ln:#2B4033;--soft:#1D3327;--acx:#2A1800;--on:#0B1A12}
:root[data-c="hi"]{--bg:#fff;--card:#fff;--tx:#000;--mu:#111;--pr:#005A2B;--on:#fff;--ln:#000}
:root[data-theme="dark"][data-c="hi"]{--bg:#000;--card:#000;--tx:#fff;--mu:#fff;--pr:#6BFF9F;--on:#000;--ln:#fff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:1.125rem/1.6 "Atkinson Hyperlegible",Verdana,system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}h1{font-size:2.1rem}h2{font-size:1.6rem}h3{font-size:1.25rem}p{margin:0 0 1em}
a{color:var(--pr)}:focus-visible{outline:4px solid var(--ac);outline-offset:3px}
.w{max-width:1080px;margin:0 auto;padding:0 18px}.sec{padding:34px 0}
header.top{background:var(--card);border-bottom:2px solid var(--ln);position:sticky;top:0;z-index:5}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;max-width:1080px;margin:auto}
.logo{font-weight:700;font-size:1.4rem;text-decoration:none;color:var(--pr);display:flex;gap:8px;align-items:center;margin-right:auto}
.logo i{background:var(--pr);color:var(--bg);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;font-style:normal}
nav.d{display:none;gap:4px}nav.d a{padding:12px 14px;border-radius:12px;text-decoration:none;color:var(--tx);font-weight:700}nav.d a.on,nav.d a:hover{background:var(--soft)}
.tools button{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font:700 1rem inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 24px;border-radius:16px;border:2px solid var(--pr);background:var(--pr);color:var(--on);font:700 1.1rem inherit;text-decoration:none;cursor:pointer}
.btn.o{background:transparent;color:var(--pr)}.btn.a{background:var(--ac);border-color:var(--ac);color:var(--acx)}.btn.sm{min-height:48px;padding:8px 16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.hero{background:linear-gradient(160deg,var(--soft),var(--bg));padding:30px 0 10px}
.hero .g{display:grid;gap:20px;align-items:center}.hero p{color:var(--mu);max-width:34em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:2px solid var(--ln);border-radius:22px;box-shadow:var(--sh);padding:18px}
.th{height:120px;border-radius:16px;background:linear-gradient(135deg,#17794B,#0E8A8A);display:grid;place-items:center;font-size:3.2rem;margin-bottom:12px}

.tag{display:inline-block;background:var(--soft);border-radius:99px;padding:3px 12px;font-size:.95rem;font-weight:700;margin:0 6px 6px 0}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.steps b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--acx);margin-bottom:8px}
.vid{aspect-ratio:16/9;border-radius:22px;background:linear-gradient(135deg,#0d3f2a,#0E8A8A);color:#fff;display:grid;place-items:center;text-align:center;padding:16px}
.vv{display:block;width:auto;max-width:100%;max-height:72vh;aspect-ratio:9/16;margin:0 auto;border-radius:22px;background:#000}
.vid span{font-size:3.4rem}
input,select,textarea{width:100%;min-height:56px;border:2px solid var(--ln);border-radius:14px;padding:10px 14px;font:inherit;background:var(--card);color:var(--tx);margin:4px 0 14px}
label{font-weight:700}.err{color:#B3261E;font-weight:700}:root[data-theme="dark"] .err{color:#FF9A92}
ul.l{padding-left:1.2em}ul.l li{margin-bottom:6px}
.alert{background:var(--soft);border-left:6px solid var(--ac);border-radius:12px;padding:14px 16px;margin:16px 0}
.map{width:100%;border-radius:22px;border:2px solid var(--ln);background:var(--soft)}
.map circle{cursor:pointer}.two{display:grid;gap:18px}
nav.b{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--ln);display:grid;grid-template-columns:repeat(4,1fr);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.b a{text-align:center;padding:8px 2px;text-decoration:none;color:var(--tx);font-size:.8rem;font-weight:700;min-height:60px}nav.b a span{display:block;height:28px}nav.b a span svg{display:block;margin:0 auto}nav.b a.on{color:var(--pr);background:var(--soft)}
footer{background:var(--card);border-top:2px solid var(--ln);padding:24px 0;color:var(--mu);font-size:1rem}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--ln);text-align:left}.sc{overflow-x:auto}
.qr{background:#fff;padding:14px;border-radius:14px;max-width:240px;margin:0 auto 10px}.qr svg{width:100%;height:auto;display:block}.qc{text-align:center;break-inside:avoid;color:#12261B;background:#fff}.qc h3,.qc b{color:#12261B}@media print{header.top,nav.b,footer,.noprint{display:none!important}body{background:#fff}}
@media(min-width:820px){nav.d{display:flex}nav.b{display:none}body{padding-bottom:0}.two{grid-template-columns:1fr 1fr}h1{font-size:2.9rem}}
@media(prefers-reduced-motion:no-preference){.hero h1{animation:up .6s both}@keyframes up{from{opacity:0;transform:translateY(12px)}}}

home:()=>`<section class="hero"><div class="w g"><div><h1>Mova-se Mais</h1><h2 style="color:var(--pr)">Seu movimento. Sua saúde. Seu espaço.</h2><p>Aprenda a usar cada equipamento da Academia da Terceira Idade com segurança. Basta apontar a câmera do celular para o QR Code.</p><div class="row"><a class="btn a" href="#/exercicios">Explorar exercícios</a></div></div>
</div></section>
<section class="sec w"><h2>Como funciona?</h2><div class="steps">${['Encontre um equipamento','Escaneie o QR Code','Aprenda o movimento','Pratique com mais segurança'].map((t,i)=>`<div class="card"><b>${i+1}</b><h3>${t}</h3></div>`).join('')}</div></section>
<section class="sec w"><h2>Exercícios em destaque</h2><div class="grid">${EX.slice(0,3).map(card).join('')}</div><p style="margin-top:16px"><a class="btn o" href="#/exercicios">Ver todos os exercícios</a></p></section>

<section class="sec w"><div class="card"><h2>Movimente-se com mais segurança</h2><p>Muitas ATIs não têm um profissional por perto. O Mova-se Mais leva a orientação até o equipamento, com passo a passo simples.</p><div class="alert">Respeite seus limites. Se sentir dor ou desconforto, interrompa o exercício.</div><a class="btn o" href="#/sobre">Conheça o projeto</a></div></section>`,
exercicios:()=>`<section class="sec w"><h1>Exercícios</h1><label for="bq">Buscar por nome, equipamento ou músculo</label><input id="bq" type="search" placeholder="Ex.: pernas, remada" oninput="fx()"><label for="bc">Categoria</label><select id="bc" onchange="fx()"><option value="">Todas</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><div class="grid" id="gx">${EX.map(card).join('')}</div></section>`,
exercicio:id=>{const e=EX.find(x=>x.id==id);if(!e)return P.nf();const u=U();if(u){u.hist=[{t:'Exercício',id:e.id,d:new Date().toISOString()},...u.hist].slice(0,30);save()}const f=u&&u.fav.includes(e.id);
return `<section class="sec w"><a href="#/exercicios">‹ Voltar aos exercícios</a><h1>${e.n}</h1><p>Equipamento: <b>${e.eq}</b> · <span class="tag">${e.cat}</span><span class="tag">${e.lv}</span></p><p>Aprenda a utilizar este equipamento de forma segura e correta.</p><div class="two" style="margin:16px 0">${VID[e.id]?`<video class="vv" controls playsinline preload="metadata" src="${VID[e.id]}" aria-label="Vídeo demonstrativo: ${e.n}">Seu aparelho não consegue mostrar este vídeo.</video>`:'<div class="vid" role="img" aria-label="Espaço reservado para o vídeo"><div><span>▶</span><p>Vídeo demonstrativo em breve</p></div></div>'}${IMG[e.id]?`<figure class="ph big"><img src="${IMG[e.id]}" alt="Imagem do equipamento ${e.n}"><figcaption>${e.n}</figcaption></figure>`:''}</div>
<div class="row" style="margin:16px 0"><button class="btn a" onclick="favEx('${e.id}')" aria-pressed="${!!f}">${f?'★ Nos favoritos':'☆ Adicionar aos favoritos'}</button><a class="btn o" href="#/exercicios">Voltar aos exercícios</a></div>
<div class="two"><div class="card"><h2>Como fazer</h2><ol class="l">${e.steps.map(s=>`<li>${s}</li>`).join('')}</ol><p><b>Sugestão:</b> ${e.rep}</p></div><div class="card"><h2>Benefícios</h2>${list(e.ben)}<h3>Músculos trabalhados</h3><p>${e.mus.map(m=>`<span class="tag">${m}</span>`).join('')}</p></div><div class="card"><h2>Cuidados</h2>${list(e.care)}</div><div class="card"><h2>Erros comuns</h2>${list(e.err)}<h3>Dica</h3><p>Vá com calma. Respirar normalmente ajuda.</p></div></div>
<p style="color:var(--mu)">QR Code deste equipamento: <b>${e.qr}</b></p></section>`},
sobre:()=>`<section class="sec w"><h1>Sobre o projeto</h1><div class="card"><h3>O problema</h3><p>Nas ATIs, quase sempre falta um profissional de Educação Física acompanhando o dia a dia. Sem orientação, o uso dos equipamentos pode acontecer de forma inadequada, com risco para articulações e músculos.</p><h3>A proposta</h3><p>Levar orientação profissional a todas as pessoas, por meio de QR Codes nos equipamentos. Cada código abre o exercício, com vídeo e passo a passo.</p><h3>O que buscamos</h3>${list(['Mais autonomia para quem pratica','Mais segurança no movimento','Incentivo à atividade física e à saúde coletiva'])}<div class="alert">O Mova-se Mais não é um serviço médico nem promete tratamento.</div></div></section>`,
contato:()=>`<section class="sec w"><h1>Contato</h1><div class="two"><form class="card" onsubmit="event.preventDefault();this.innerHTML='<h3>Mensagem enviada!</h3><p>Obrigado. Responderemos em breve (demonstração).</p>'"><label for="cn">Seu nome</label><input id="cn" required><label for="ce">E-mail</label><input id="ce" type="email" required><label for="cm">Mensagem</label><textarea id="cm" rows="4" required></textarea><button class="btn">Enviar mensagem</button></form><div class="card"><h3>Prefeitura de Cascavel – Paraná</h3><p>Projeto de orientação em atividade física para as ATIs.<br>Contato institucional: <b>contato@movasemais.exemplo</b></p></div></div></section>`,
login:()=>`<section class="sec w" style="max-width:520px"><h1>Entrar ou criar conta</h1>${msg?`<p class="alert">${msg}</p>`:''}<form class="card" onsubmit="auth(event,'in')"><h2>Entrar</h2><label for="le">E-mail</label><input id="le" type="email" required autocomplete="email"><label for="lp">Senha</label><input id="lp" type="password" required autocomplete="current-password"><p class="err" id="le1" role="alert"></p><button class="btn">Entrar</button> <button type="button" class="btn o sm" onclick="rec()">Esqueci a senha</button></form><form class="card" style="margin-top:18px" onsubmit="auth(event,'up')"><h2>Criar conta</h2><label for="rn">Nome</label><input id="rn" required><label for="re">E-mail</label><input id="re" type="email" required><label for="rp">Senha (mínimo 6 caracteres)</label><input id="rp" type="password" minlength="6" required autocomplete="new-password"><p class="err" id="re1" role="alert"></p><button class="btn a">Criar conta</button></form></section>`,
conta:()=>{const u=U();if(!u){msg='Entre para ver seu espaço.';location.hash='#/login';return ''}msg='';const fe=u.fav.map(i=>EX.find(e=>e.id==i)).filter(Boolean),fa=u.afav.map(i=>ATI.find(a=>a.id==i)).filter(Boolean),rc=[...new Set(u.hist.map(h=>h.id))].slice(0,3).map(i=>EX.find(e=>e.id==i)).filter(Boolean);
return `<section class="sec w"><h1>Olá, ${esc(u.nome)}!</h1><h2>Exercícios favoritos</h2><div class="grid">${fe.map(card).join('')||'<p>Você ainda não favoritou exercícios.</p>'}</div><h2 style="margin-top:24px">Exercícios recentes</h2><div class="grid">${rc.map(card).join('')||'<p>Nada por aqui ainda.</p>'}</div><h2 style="margin-top:24px">Histórico</h2><ul class="l">${u.hist.slice(0,8).map(h=>`<li>${EX.find(e=>e.id==h.id).n} – ${new Date(h.d).toLocaleDateString('pt-BR')}</li>`).join('')||'<li>Sem atividades.</li>'}</ul><h2>Configurações</h2><form class="card" onsubmit="event.preventDefault();u2=U();u2.nome=$('#pn').value;save();go()"><label for="pn">Nome do perfil</label><input id="pn" value="${esc(u.nome)}" required><button class="btn sm">Salvar perfil</button></form><p style="margin-top:16px"><button class="btn o" onclick="me=null;save();location.hash='#/'">Sair da conta</button></p></section>`},
qrcodes:()=>{const base=location.href.split('#')[0];const ok=typeof qrcode=='function';return `<section class="sec w"><h1>QR Codes dos equipamentos</h1><div class="noprint"><p>Cada código abre a página do exercício, sem login. Para imprimir ou salvar em PDF, use o botão abaixo.</p><button class="btn a" onclick="print()">Imprimir ou salvar em PDF</button><p class="alert">Os QR Codes apontam para este endereço: <b>${esc(base)}</b>. Antes de imprimir, publique o site no endereço definitivo e gere os códigos de novo por lá.</p></div>${ok?'':'<p class="err">Não foi possível carregar o gerador de QR Code. Verifique a conexão e recarregue.</p>'}<div class="grid">${ok?EX.map(e=>{const q=qrcode(0,'M');q.addData(base+'#/qr/'+e.qr);q.make();return `<div class="card qc"><div class="qr" role="img" aria-label="QR Code de ${e.n}">${q.createSvgTag({cellSize:4,margin:0,scalable:true})}</div><h3>${e.n}</h3><b>${e.qr}</b><p style="font-size:.9rem">Aponte a câmera do celular</p></div>`}).join(''):''}</div></section>`},
admin:()=>`<section class="sec w"><h1>Painel administrativo</h1><p class="alert">Estrutura de demonstração. Com o back-end, aqui será possível cadastrar ATIs, equipamentos, exercícios, vídeos e QR Codes.</p><div class="grid">${[['Usuários cadastrados',Object.keys(users).length],['Exercício mais acessado','Leg Press'],['Favoritos no total',Object.values(users).reduce((s,u)=>s+u.fav.length,0)]].map(([k,v])=>`<div class="card"><p>${k}</p><h2>${v}</h2></div>`).join('')}</div><h2 style="margin-top:24px">QR Codes</h2><p><a class="btn a sm" href="#/qrcodes">Gerar e imprimir QR Codes</a></p><div class="sc"><table><tr><th>Código</th><th>Equipamento</th><th>Link</th></tr>${EX.map(e=>`<tr><td>${e.qr}</td><td>${e.n}</td><td><a href="#/qr/${e.qr}">Simular escaneamento</a></td></tr>`).join('')}</table></div></section>`,
nf:()=>`<section class="sec w"><h1>Página não encontrada</h1><a class="btn" href="#/">Voltar ao início</a></section>`};
function fx(){const t=$('#bq').value.toLowerCase(),c=$('#bc').value;$('#gx').innerHTML=EX.filter(e=>(!c||e.cat==c)&&(e.n+e.mus.join(' ')+e.cat).toLowerCase().includes(t)).map(card).join('')||'<p>Nenhum exercício encontrado. Tente outra palavra.</p>'}
function auth(ev,k){ev.preventDefault();if(k=='in'){const e=$('#le').value.trim().toLowerCase(),u=users[e];if(!u||u.p!=btoa($('#lp').value)){$('#le1').textContent='E-mail ou senha incorretos. Confira e tente de novo.';return}me=e}else{const e=$('#re').value.trim().toLowerCase();if(users[e]){$('#re1').textContent='Este e-mail já tem conta. Use a opção Entrar.';return}users[e]={nome:$('#rn').value.trim(),p:btoa($('#rp').value),fav:[],afav:[],hist:[]};me=e}save();msg='';location.hash='#/conta'}
function rec(){const e=$('#le').value;$('#le1').textContent=e?'Se existir uma conta com este e-mail, enviaremos um link para criar nova senha (demonstração).':'Digite seu e-mail acima primeiro.'}
function nav(){const h=location.hash||'#/',it=[['#/','Início','M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10'],['#/exercicios','Exercícios',IC['Membros superiores']],['#/conta','Favoritos','M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z'],[me?'#/conta':'#/login','Perfil','M12 4a4 4 0 1 0 .01 0M4 21c0-4 4-6 8-6s8 2 8 6']],d=[['#/','Início'],['#/exercicios','Exercícios'],['#/sobre','Sobre'],['#/contato','Contato'],[me?'#/conta':'#/login','Minha conta']];
$('#nd').innerHTML=d.map(([a,t])=>`<a href="${a}" class="${h==a?'on':''}">${t}</a>`).join('');$('#nb').innerHTML=it.map(([a,t,i])=>`<a href="${a}" class="${h==a?'on':''}"><span aria-hidden="true">${ico(i,28)}</span>${t}</a>`).join('')}
function go(){const p=location.hash.slice(2).split('/'),k=p[0]||'home';if(k=='qr'){const e=EX.find(x=>x.qr==p[1]);location.replace('#/exercicio/'+(e?e.id:''));return}if(k!='atis'){sel=null}const f=P[k]||P.nf;$('#main').innerHTML=f(p[1]);nav()}
window.addEventListener('hashchange',()=>{go();window.scrollTo(0,0)});go();
</script>
</body>
</html>
